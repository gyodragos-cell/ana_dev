version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 10
    reviewers:
      - "gyodragos-cell"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    labels:
      - "ci-cd"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # npm dependencies (for Jules MCP)
  - package-ecosystem: "npm"
    directory: "/../jules/jules-mcp-server-main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "jules"
    commit-message:
      prefix: "deps"
